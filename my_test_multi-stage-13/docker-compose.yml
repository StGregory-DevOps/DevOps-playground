services:
  postgres:
    image: postgres:16-alpine
    container_name: pixelforge
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - backend-net
    volumes:
      - postgres_db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelforge -d pixelforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  api:
    build:
      context: ./api
    container_name: api-service
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./uploads:/data/uploads
      - ./processed:/data/processed
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
     context: ./worker
    container_name: worker-service
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./uploads:/data/uploads
      - ./processed:/data/processed
    networks:
      - backend-net
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/heartbeat'); process.exit(Date.now()-s.mtimeMs<30000?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.25-alpine
    container_name: proxy
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/data/uploads:ro
      - ./processed:/data/processed:ro
      - ./frontend:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "8084:80"
    networks:
      - backend-net
      - frontend-net
    depends_on:
      api:
        condition: service_healthy

networks:
  backend-net:
  frontend-net:

volumes:
  postgres_db:
  uploads:
  processed:
