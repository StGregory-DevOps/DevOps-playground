services:
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    env_file:
      - .env
    volumes:
      - postgres_db:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  redis:
    image: redis:7-alpine
    container_name: app-redis
    env_file:
      - .env
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build:
      context: ./api-service
    container_name: task_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker-service
    container_name: task_worker
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - backend-net
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy


  nginx:
    image: nginx:1.27-alpine
    container_name: proxy
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "8084:80"
    networks:
      - backend-net
    depends_on:
      api:
        condition: service_healthy

networks:
  backend-net:

volumes:
  postgres_db:
  redis_data:

