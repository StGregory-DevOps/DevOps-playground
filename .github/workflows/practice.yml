name: Practice

on: [push, pull_request]

# Уровень Workflow (видно всем джобам)
env:
  APP_NAME: "LinkWatch-Training"

jobs:
  practice_env:
    runs-on: ubuntu-latest
    steps:
      - name: Показать переменные
        run: |
          echo "Имя приложения: $APP_NAME"
          # Достаем переменную из настроек репозитория (Variables)
          echo "Моя переменная: ${{ vars.MY_VARIABLE }}"
          # Достаем секрет (в логах GitHub его скроет звездочками!)
          echo "Мой секрет: ${{ secrets.MY_SUPER_SECRET }}"
   
     # --- ПРАКТИКА 2: ХЭШ И OUTPUTS ---
  prepare_hash:
    runs-on: ubuntu-latest
    outputs:
    # Объявляем, что отдаем наружу короткий хэш
      short_commit: ${{ steps.get_hash.outputs.short_sha }}
    steps:
      - name: Вычислить хэш
        id: get_hash # Название предумываешь сам
        # short_sha- название предумываешь сам
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  use_hash:
    needs: prepare_hash # Ждем первую джобу
    runs-on: ubuntu-latest
    steps:
      - name: Прочитать хэш из другой джобы
        run: echo "Мы получили хэш коммита:${{needs.prepare_hash.outputs.short_commit }}"
  book_practice:
    runs-on: ubuntu-latest
    steps:
    # Практика 1: Проверка ветки
      - name: Выполнится только в ветке main
        if: github.ref == 'refs/heads/main'
        run: echo "Мы находимся в ветке main!"

      - name: А этот шаг выполнится всегда
        run: echo "Я работаю в любой ветке"

    # Практика 2: Ошибка и условия
      #- name: Специально вызываем ошибку
       # run: exit 1

      #- name: Этот шаг НЕ выполнится (нет if:always)
      #  run: echo "Вы меня не увидите"

      - name: А этот выполнится ВСЕГДА
        if: always()
        run: echo "Я сработал, потому что у меня if:always()"
