name: CI
on: push
jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v7

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Установить зависимости api
        working-directory: my_test_multi-stage-13/api
    
        run: npm ci
