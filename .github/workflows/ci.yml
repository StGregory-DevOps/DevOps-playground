name: CI
on: push

permissions: 
  contents: read
  packages: write
  
jobs:
  build-and-push-api:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v7

      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и запушить образ api
        uses: docker/build-push-action@v7
        with:
          context: my_test_multi-stage-13/api
          push: true
          tags: ghcr.io/stgregory-devops/devops-playground/pixelforge-api:${{ github.sha }}
          


  build-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v7
        
      - name: Войти в GitHub Container Registry
        uses: docker/login-action@v4
        with:                                          
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и запушить образ worker
        uses: docker/build-push-action@v7
        with:
          context: my_test_multi-stage-13/worker
          push: true
          tags: ghcr.io/stgregory-devops/devops-playground/pixelforge-worker:${{ github.sha }}
