<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkVault — твоя коллекция ссылок</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🔖 LinkVault</h1>
      <p>Сохраняй ссылки — заголовок и описание подтянутся сами</p>
    </header>

    <form id="add-form" class="add-form">
      <input type="url" id="url-input" placeholder="https://example.com/article" required />
      <input type="text" id="note-input" placeholder="Заметка (необязательно)" />
      <button type="submit">Добавить</button>
    </form>

    <div id="error-banner" class="error-banner hidden"></div>

    <div id="bookmarks" class="bookmarks-grid">
      <p class="empty-state" id="empty-state">Пока пусто. Добавь первую ссылку выше.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
