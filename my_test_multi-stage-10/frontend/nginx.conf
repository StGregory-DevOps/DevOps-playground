server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Отдача собранной SPA-статики (Vite build).
    # try_files с fallback на index.html нужен для client-side роутинга:
    # если пользователь напрямую открывает /some/route, Nginx не должен
    # отдавать 404, а должен вернуть index.html и отдать роутинг React'у.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование запросов фронтенда на сервис api внутри frontend-net.
    # "api" здесь — имя сервиса api в docker-compose.yml (Docker DNS).
    location /api/ {
        proxy_pass http://api:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Не отдавать наружу служебные файлы (.env, .git и т.п.), если вдруг
    # окажутся в контексте сборки.
    location ~ /\. {
        deny all;
    }
}
