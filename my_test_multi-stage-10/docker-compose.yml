services:
  postgres_db:
    image: postgres:16-alpine
    container_name: app-postgres
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_db:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  redis_cache:
    image: redis:7-alpine
    container_name: app-redis
    env_file:
      - .env
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    build:
      context: ./api
    container_name: task_api
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - db-net
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    container_name: task_worker
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - backend-net
    depends_on:
      redis_cache:
        condition: service_healthy
      api:
        condition: service_healthy


  nginx:
    build:
      context: ./frontend
    container_name: proxy
    restart: unless-stopped
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "8084:80"
    networks:
      - frontend-net
    depends_on:
      api:
        condition: service_healthy

networks:
  backend-net:
  frontend-net:
  db-net:

volumes:
  postgres_db:
  redis_data:
