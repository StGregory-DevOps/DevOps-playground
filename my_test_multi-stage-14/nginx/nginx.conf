# Конфиг предполагает, что в docker-compose api-сервис называется "api"
# и слушает порт 8000. У этого проекта нет фронтенда -- nginx тут чистый
# reverse proxy перед FastAPI, без раздачи статики.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
