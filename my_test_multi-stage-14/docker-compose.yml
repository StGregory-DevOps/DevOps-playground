services:
  mysql:
    image: mysql:8
    container_name: init_sql
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$MYSQL_ROOT_PASSWORD"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3


  api:
    build:
      context: ./api
    container_name: task_api
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - backend-net
      - proxy-net
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    build:
      context: ./worker
    container_name: task_worker
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - backend-net
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: proxy
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "8084:80"
    networks:
      - proxy-net
    depends_on:
      api:
        condition: service_healthy

networks:
  backend-net:
  proxy-net:

volumes:
  mysql_data:
